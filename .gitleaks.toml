[extend]
# Baseline: any secret committed before this guard existed must be reported.
# Scan current history once via `gitleaks git --report-format=json --exit-code=1`
# and commit the resulting baseline to fail on NEW leaks only.

[allowlist]
description = "Test fixtures and documentation examples"
paths = [
  '''worker/src/.*(?i)(test|fixture|spec).*\.(ts|js)$''',
]
regexes = [
  '''AIzaSyA0123456789abcdefghijklmnopqrstuvwxyz''',
  '''ghp_abcdefghijklmnopqrstuvwxyz1234567890''',
]