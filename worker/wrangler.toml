name = "parakh-worker"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

[[queues.producers]]
queue = "parakh-watchdog"
binding = "WATCHDOG_QUEUE"

[[queues.consumers]]
queue = "parakh-watchdog"
max_retries = 0
max_batch_size = 1

# Secrets (set via `wrangler secret put <NAME>`):
# GITHUB_APP_ID
# GITHUB_APP_PRIVATE_KEY
# GITHUB_WEBHOOK_SECRET
# GEMINI_API_KEY
# DATABASE_URL
# UPSTASH_REDIS_URL
# UPSTASH_REDIS_TOKEN
# WORKER_API_SECRET

[observability.logs]
enabled = true
invocation_logs = true

[triggers]
crons = ["* * * * *"]
